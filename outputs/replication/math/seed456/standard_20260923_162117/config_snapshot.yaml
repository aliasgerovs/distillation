run:
  seed: 456
  output_dir: outputs/replication/math/seed456
  run_name: standard
  save_config_snapshot: true
data:
  dataset_name: math
  train_size: 5000
  holdout_size: 2500
  test_size: 5000
  materialize_splits: true
model:
  teacher: /scratch/aliasgarov/distillation-game/models/DeepSeek-R1-Distill-Qwen-7B
  proxy_student: /scratch/aliasgarov/distillation-game/models/Qwen2.5-3B
  student: /scratch/aliasgarov/distillation-game/models/Llama-3.2-3B
  tokenizer: null
  student_tokenizer: unsloth/Llama-3.2-3B-Instruct
  attn_implementation: flash_attention_2
  torch_dtype: bfloat16
generation:
  temperature: 0.6
  top_p: 0.95
  eps: 0.01
  max_prompt_tokens: 512
  max_new_tokens: 1024
  answer_force: true
  answer_force_suffix: '


    **Final Answer**

    \[\boxed{'
  answer_force_max_new_tokens: 32
  batch_size: 64
  greedy: false
teachers:
  standard: true
  antidistillation_lams: []
  poe_gammas: []
  strategic_beta_teachers: []
distill:
  student_modes:
  - naive
  - strategic_fd
  beta_s_values:
  - 0.5
  penalty_transform: exp
  lr: 0.0005
  weight_decay: 0.1
  max_grad_norm: 1.0
  warmup_ratio: 0.03
  lr_scheduler_type: cosine
  num_epochs: 3
  per_device_train_batch_size: 6
  gradient_accumulation_steps: 4
  max_length: 2048
  lora_r: 128
  lora_alpha: 128
  lora_dropout: 0.0
  save_final_model: false
  holdout_grad_batch_size: 6
  trace_weights_fd_batch_size: 12
artifacts:
  save_full_text_traces: false
  save_prompt_dictionary: true
  save_inspection_samples: 5
